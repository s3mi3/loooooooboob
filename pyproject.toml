[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-dex-explorer"
version = "1.0.0"
description = "External Dex-style explorer for your own Roblox game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.25.0"]

[project.scripts]
roblox-dex = "roblox_dex.__main__:main"

[tool.setuptools.packages.find]
include = ["roblox_dex*"]

[tool.setuptools.package-data]
roblox_dex = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
